apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tp15-staging
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs: { environment: staging }
replicas:
  - name: whoami
    count: 2
configMapGenerator:
  - name: whoami-config
    behavior: merge
    literals:
      - WHOAMI_NAME=staging
