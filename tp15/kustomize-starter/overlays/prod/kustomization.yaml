apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tp15-prod
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs: { environment: prod }
replicas:
  - name: whoami
    count: 3
images:
  - name: traefik/whoami
    newTag: v1.10.1
configMapGenerator:
  - name: whoami-config
    behavior: merge
    literals:
      - WHOAMI_NAME=prod
      - LOG_LEVEL=warn
patches:
  # patch JSON 6902 : limite mémoire à 128Mi
  - target: { kind: Deployment, name: whoami }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
  # patch stratégique (fichier) : ajoute une readinessProbe
  - path: readiness-patch.yaml
