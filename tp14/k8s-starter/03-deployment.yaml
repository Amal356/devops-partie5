apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: tp14
  labels: { app: whoami }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: whoami }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # jamais moins de pods prêts que demandé
      maxSurge: 1            # un pod de plus pendant la mise à jour
  template:
    metadata:
      labels: { app: whoami }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.0
          args: ["--port", "8080"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: whoami-config }
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef: { name: whoami-secret, key: api-key }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
